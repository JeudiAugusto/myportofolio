<div class="project-delete-wrapper">

    <button
        type="button"
        class="project-delete-button"
        popovertarget="delete-project-{{ project.id }}"
        aria-label="Hapus {{ project.title }}"
        title="Hapus project"
    >
        Delete Project
    </button>


    <div
        id="delete-project-{{ project.id }}"
        class="project-delete-modal"
        popover="auto"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-project-title-{{ project.id }}"
    >

        <button
            type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"
        ></button>


        <div class="project-delete-modal__content">

            <button
                type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ project.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus"
            >
                ×
            </button>


            <p class="project-delete-modal__eyebrow">
                DELETE PROJECT
            </p>

            <h2
                id="delete-project-title-{{ project.id }}"
            >
                Delete this project?
            </h2>

            <p class="project-delete-modal__description">
                Apakah kamu yakin ingin menghapus
                <strong>{{ project.title }}</strong>?
                Tindakan ini akan menghapus project dari database.
            </p>


            <div class="project-delete-modal__actions">

                <button
                    type="button"
                    class="project-delete-cancel"
                    popovertarget="delete-project-{{ project.id }}"
                    popovertargetaction="hide"
                >
                    Cancel
                </button>


                <form
                    method="POST"
                    action="{% url 'main:delete_project' project.id %}"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="project-delete-confirm"
                    >
                        Yes, Delete
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
